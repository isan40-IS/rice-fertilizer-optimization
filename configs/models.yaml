scoring: "neg_root_mean_squared_error"
search_iterations: 30
n_jobs: -1
random_state: 42
permutation_importance_repeats: 10
permutation_importance_n_jobs: 1

models:
  linear_regression:
    enabled: true
    class: linear_regression
    params: {}
    search_space: {}

  random_forest:
    enabled: true
    class: random_forest
    params:
      n_estimators: 300
      random_state: 42
      n_jobs: -1
    search_space:
      model__n_estimators: [200, 300, 500, 800]
      model__max_depth: [null, 6, 10, 16, 24]
      model__min_samples_split: [2, 5, 10]
      model__min_samples_leaf: [1, 2, 4, 8]
      model__max_features: ["sqrt", "log2", 0.5, 0.8, 1.0]

  xgboost:
    enabled: true
    class: xgboost
    params:
      objective: "reg:squarederror"
      random_state: 42
      n_jobs: -1
    search_space:
      model__n_estimators: [200, 400, 700, 1000]
      model__max_depth: [2, 3, 4, 6, 8]
      model__learning_rate: [0.01, 0.03, 0.05, 0.1]
      model__subsample: [0.6, 0.8, 1.0]
      model__colsample_bytree: [0.6, 0.8, 1.0]
      model__min_child_weight: [1, 3, 5, 10]
      model__reg_alpha: [0.0, 0.01, 0.1, 1.0]
      model__reg_lambda: [0.5, 1.0, 5.0, 10.0]

  catboost:
    enabled: true
    class: catboost
    params:
      verbose: false
      random_seed: 42
      allow_writing_files: false
    search_space:
      model__iterations: [300, 600, 1000]
      model__depth: [4, 6, 8, 10]
      model__learning_rate: [0.01, 0.03, 0.05, 0.1]
      model__l2_leaf_reg: [1, 3, 5, 10]
      model__random_strength: [0.0, 0.5, 1.0, 2.0]

selection:
  metric_weights:
    rmse_mean: 0.40
    mae_mean: 0.25
    rmse_std: 0.15
    mae_std: 0.10
    r2_mean: -0.10
  minimum_r2: null
