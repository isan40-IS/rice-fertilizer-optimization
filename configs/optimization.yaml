random_seed: 42
seeds: [11, 29, 47, 71, 101]

differential_evolution:
  strategy: "best1bin"
  popsize: 15
  mutation: [0.5, 1.0]
  recombination: 0.7
  maxiter: 300
  tol: 0.0001
  polish: false
  workers: 1
  updating: "immediate"

objective:
  use_yield_improvement: true
  normalize_yield_improvement: true
  infeasible_cost: 1000000000000.0
  epsilon: 0.00000001

scenario:
  mode: "per_observation"
  max_scenarios: null
  scenario_id_column: "record_id"
