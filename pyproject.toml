[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rice-fertilizer-optimization"
version = "0.1.0"
description = "Machine-learning surrogate and Differential Evolution framework for rice NPK fertilizer optimization"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Hizkia Crisantino"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "PyYAML>=6.0",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "pyarrow>=15.0",
  "xgboost>=2.0",
  "catboost>=1.2",
  "openpyxl>=3.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
